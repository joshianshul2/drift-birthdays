name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # needed to publish the APK as a GitHub Release

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # The runner image ships the Android SDK; just accept licenses so Gradle
      # can fetch the exact platform/build-tools it needs.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install, test and build web app
        run: |
          npm ci
          npm test
          npm run build
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../drift-birthdays.apk

      - uses: actions/upload-artifact@v4
        with:
          name: drift-birthdays-apk
          path: drift-birthdays.apk

      # A Release gives a plain download link you can open on your phone.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Drift Birthdays (build ${{ github.run_number }})
          body: Open this page on your Android phone and tap drift-birthdays.apk to install.
          files: drift-birthdays.apk
          make_latest: true
